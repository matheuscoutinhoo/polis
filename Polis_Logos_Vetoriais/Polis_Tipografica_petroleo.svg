<title id="titulo">Polis — assinatura tipográfica</title>
<desc id="descricao">Marca Polis. Arquitetura cívica e livro aberto. Arte vetorial em curvas, sem imagens incorporadas e sem fontes externas. Fundo transparente.</desc>
